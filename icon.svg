<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303136"/>
      <stop offset="1" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e7eb"/>
    </linearGradient>
    <linearGradient id="dim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6a6b70"/>
      <stop offset="1" stop-color="#55565b"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <!-- background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(12 0)">
    <!-- Mac: screen, the windows on it, the base -->
    <rect x="165" y="395" width="530" height="345" rx="34" fill="none" stroke="url(#ink)" stroke-width="30"/>
    <rect x="222" y="452" width="175" height="112" rx="14" fill="url(#dim)"/>
    <rect x="420" y="580" width="200" height="112" rx="14" fill="url(#dim)"/>
    <rect x="110" y="772" width="640" height="30" rx="15" fill="url(#ink)"/>
    <path d="M370 772 L384 758 H476 L490 772 Z" fill="url(#ink)"/>
    <!-- the lift: cut through the screen's edge, then the arc -->
    <path d="M500 520 Q505 345 628 312" fill="none" stroke="#1c1d20" stroke-width="58" stroke-linecap="round"/>
    <path d="M500 520 Q505 345 628 312" fill="none" stroke="url(#ink)" stroke-width="22" stroke-linecap="round"/>
    <!-- the window taken off the Mac -->
    <g filter="url(#lift)">
      <rect x="645" y="222" width="260" height="190" rx="24" fill="url(#ink)"/>
    </g>
    <circle cx="684" cy="262" r="15" fill="#ff5f57"/>
    <circle cx="721" cy="262" r="15" fill="#febc2e"/>
    <circle cx="758" cy="262" r="15" fill="#28c840"/>
  </g>
</svg>
